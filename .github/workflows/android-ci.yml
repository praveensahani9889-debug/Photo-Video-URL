name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Accepts Android SDK licenses and ensures Android 36 packages exist on the runner
      - name: Accept Android SDK Licenses & Prepare Platform
        run: |
          echo "Using Android SDK at: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      # Installs Gradle 9.3.1 CLI into PATH
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Ensures gradlew exists with Unix line endings and executable permissions
      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found in repo root. Generating wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          sed -i 's/\r$//' ./gradlew || true
          chmod +x ./gradlew || true

      # Restore debug.keystore from debug.keystore.base64 (or generate fallback)
      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

      # Files that were removed or renamed in newer versions of the project must not be left over in the repository
      # (a leftover old file breaks the build). They are deleted here, so copying a new version over an old one is safe.
      - name: Remove files of older versions
        run: |
          rm -f app/src/main/java/com/praveen/studio/photovideo/url/ads/UnityRewardedBackend.kt
          rm -f app/src/fallback/UnityRewardedBackend.kt.txt

      # Build the main APK (debug build type). The published APK uses REAL Unity ads (-PadsTestMode=false);
      # builds on a developer machine / AI Studio keep test ads by default. To see Unity TEST ads in the published APK, add
      # a repository variable ADS_TEST_MODE = true (Settings > Secrets and variables > Actions > Variables).
      - name: Build Debug APK (with Unity Ads)
        id: build_ads
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug -PadsTestMode=${{ vars.ADS_TEST_MODE || 'false' }} --stacktrace 2>&1 | tee build-ads.log

      # Shows the real compile errors in the run summary (no need to search the long log).
      - name: Show errors of the Unity Ads build
        if: steps.build_ads.outcome == 'failure'
        run: |
          {
            echo "### Unity Ads build failed - the errors"
            echo '```'
            grep -E "^e: |error:|What went wrong|Execution failed|Unresolved reference|cannot find symbol|does not exist" -A3 build-ads.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|Execution failed|cannot find symbol|does not exist" build-ads.log | head -15 | while IFS= read -r line; do echo "::error::${line}"; done || true

      # Safety net: if the Unity Ads code does not compile, publish an APK WITHOUT ads instead of no APK at all.
      - name: Fallback build without Unity Ads (only if the step above failed)
        if: steps.build_ads.outcome == 'failure'
        run: |
          set -o pipefail
          echo "::warning::Unity Ads code failed to compile (see the previous step). Building an APK WITHOUT ads."
          cp app/src/fallback/UnityAdsBridge.java.txt app/src/main/java/com/praveen/studio/photovideo/url/ads/UnityAdsBridge.java
          sed -i '/libs.unity.ads/d' app/build.gradle.kts
          gradle assembleDebug -PadsTestMode=${{ vars.ADS_TEST_MODE || 'false' }} --stacktrace 2>&1 | tee build-fallback.log || {
            {
              echo "### Fallback build (without ads) failed - the errors"
              echo '```'
              grep -E "^e: |error:|What went wrong|Execution failed|Unresolved reference|cannot find symbol|does not exist" -A3 build-fallback.log | head -80 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      # Build the small optimised APK (R8 shrinking). It is an extra download: if this step
      # fails, the normal APK above is still published.
      - name: Build Small APK
        id: small
        continue-on-error: true
        run: gradle assembleOptimized --stacktrace

      # Prepare user-friendly named APK files for direct download
      - name: Prepare Direct APK Files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PhotoVideoURL-v2.4.2.apk
          if [ "${{ steps.small.outcome }}" = "success" ] && [ -f app/build/outputs/apk/optimized/app-optimized.apk ]; then
            cp app/build/outputs/apk/optimized/app-optimized.apk PhotoVideoURL-v2.4.2-small.apk
          fi
          ls -lh PhotoVideoURL-v2.4.2*.apk

      # Upload Debug APK as Action Artifact (backup)
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-video-url-debug-apk
          path: PhotoVideoURL-v2.4.2*.apk
          if-no-files-found: error

      # Publish directly to GitHub Releases so users get a direct .apk download (No ZIP!)
      - name: Publish Direct APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.4.2-${{ github.run_number }}"
          name: "Photo Video URL v2.4.2 (build ${{ github.run_number }})"
          body: |
            ## 📱 Photo Video URL Android App (Build #${{ github.run_number }})
            
            **Direct APK Download** — Click the link below under **Assets** to download and install directly on your Android phone without needing to unzip:
            
            - **File:** `PhotoVideoURL-v2.4.2.apk` (normal, safest) and `PhotoVideoURL-v2.4.2-small.apk` (smaller, optimised)
            - **Package Name:** `com.praveen.studio.photovideo.url`
            - **Features:** Supabase Storage, ivu.gt.tc Short URLs, Direct Share Target, Deep Linking, 50MB+ ZIP & Upload, APK Extractor.
          files: |
            PhotoVideoURL-v2.4.2.apk
            PhotoVideoURL-v2.4.2-small.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
