name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Accepts Android SDK licenses and ensures Android 36 packages exist on the runner
      - name: Accept Android SDK Licenses & Prepare Platform
        run: |
          echo "Using Android SDK at: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      # Installs Gradle 9.3.1 CLI into PATH
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Ensures gradlew exists with Unix line endings and executable permissions
      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found in repo root. Generating wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          sed -i 's/\r$//' ./gradlew || true
          chmod +x ./gradlew || true

      # Restore debug.keystore from debug.keystore.base64 (or generate fallback)
      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore"
          fi

      # Build Debug APK using Gradle CLI
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      # Prepare user-friendly named APK for direct download
      - name: Prepare Direct APK File
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PhotoVideoURL-v1.0.apk
          ls -lh PhotoVideoURL-v1.0.apk

      # Upload Debug APK as Action Artifact (backup)
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-video-url-debug-apk
          path: PhotoVideoURL-v1.0.apk
          if-no-files-found: error

      # Publish directly to GitHub Releases so users get a direct .apk download (No ZIP!)
      - name: Publish Direct APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Photo Video URL v1.0.${{ github.run_number }} (Direct APK)"
          body: |
            ## 📱 Photo Video URL Android App (Build #${{ github.run_number }})
            
            **Direct APK Download** — Click the link below under **Assets** to download and install directly on your Android phone without needing to unzip:
            
            - **File:** `PhotoVideoURL-v1.0.apk`
            - **Package Name:** `com.praveen.studio.photovideo.url`
            - **Features:** Supabase Storage, ivu.gt.tc Short URLs, Direct Share Target, Deep Linking, 50MB+ ZIP & Upload, APK Extractor.
          files: PhotoVideoURL-v1.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
